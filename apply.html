<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" />
    <title>T.C | Kimlik Başvuru Formu</title>
    <style>
         body {
            background: #f0f2f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            background-color: rgb(152, 4, 4);
            padding: 0 20px;
        }

        nav ul {
            margin-bottom: 0;
        }

        nav a {
            color: #fff !important;
    align-self: center !important;
    font-size: 20px !important;
    text-decoration: none !important;
    padding: 10px !important;
        }

        nav img {
            align-self: flex-start;
            max-height: 45px;
            width: auto;
            object-fit: contain;
            margin-top: 7px;
        }

        .navigation {
            list-style: none;
            display: flex;
        }

        .navigation a {
            padding: 20px;
            display: block;
        }

        .navigation a:hover {
            background-color: rgb(191, 9, 47);
        }

        .navigation li:last-child {
            display: none;
        }

        .menu-toggle a {
            padding: 10px;
            border: none !important;
            background: none;
        }

        .menu-toggle i {
            font-size: 26px;
            line-height: 1;
        }
        
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                position: relative;
            }

            nav img {
                align-self: flex-start;
                max-height: 35px;
                margin: 5px;
                object-fit: contain;
            }

            .navigation {
                flex-direction: column;
            }

            .navigation a {
                text-align: center;
                padding: 10px;
                border-top: 1px solid rgba(255, 255, 255, 0.3);
                border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            }

            .navigation li:last-child {
                display: block;
                position: absolute;
                top: 0;
                right: 10px;
            }

            .navigation li:not(:last-child) {
                display: none;
            }

            nav.active .navigation li:not(:last-child) {
                display: block;
            }

            .navigation li:last-child a {
                border-bottom: none;
            }

            .menu-toggle a {
                border-top: none;
                border-bottom: none;
            }
        }

        .form-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .btn-primary {
            background-color: rgb(152, 4, 4);
            border-color: rgb(152, 4, 4);
        }

        .btn-primary:hover {
            background-color: rgb(191, 9, 47);
            border-color: rgb(191, 9, 47);
        }
    </style>
</head>
<body>
    <nav id="main-nav">
        <img src="img/turklogo.png" alt="Logo">
        <ul class="navigation">
            <li><a href="cardinformation.html" class="nav-link">Bilgiler</a></li>
            <li><a href="apply.html" class="nav-link">Başvuru</a></li>
            <li class="logout-item"><a href="javascript:void(0)" onclick="logout()" class="logout-btn">Çıkış Yap</a></li>
            <li class="menu-toggle">
                <a href="javascript:void(0)" onclick="displayMenu()">
                    <i class="fa-solid fa-bars"></i>
                </a>
            </li>
        </ul>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-6 mx-auto">
                <div class="card form-card">
                    <div class="card-body">
                        <h1 class="h4 text-center mb-4">Başvuru Formu</h1>
                        <form method="post" action="">
                            <div class="mb-3">
                                <label for="Name" class="form-label">Ad</label>
                                <input type="text" id="Name" name="Name" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="Surname" class="form-label">Soyad</label>
                                <input type="text" id="Surname" name="Surname" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="Phone" class="form-label">T.C. No</label>
                                <input type="tel" id="Phone" name="Phone" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="Unit" class="form-label">Birimi</label>
                                <input type="text" id="Unit" name="Unit" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="Position" class="form-label">Görevi</label>
                                <input type="text" id="Position" name="Position" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="Email" class="form-label">Email</label>
                                <input type="email" id="Email" name="Email" class="form-control" required />
                            </div>
                            <div class="mb-3">
                                <label for="WillAttend" class="form-label">Cinsiyet</label>
                                <select id="WillAttend" name="WillAttend" class="form-select" required>
                                    <option value="">Seçiniz</option>
                                    <option value="true">Erkek</option>
                                    <option value="false">Kadın</option>
                                </select>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Kaydet</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function displayMenu() {
            document.getElementById("main-nav").classList.toggle("active");
        }
    </script>
</body>
</html>
